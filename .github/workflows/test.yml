name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    # 1.0.158's Linux asset is not reliably runnable on this image: across three
    # runs of one unchanged commit it passed once and failed twice, always with
    # "Could not load file or assembly 'System.IO.Compression.ZipFile,
    # Version=10.0.0.0'" at the first document *before* the plugin is invoked —
    # so it measures the environment, not this plugin. The arm stays in the
    # matrix (its evidence is worth collecting) but it does not gate the build.
    # 1.0.158's plugin behaviour is measured on macOS arm64; see the README.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # The two released officecli binaries this plugin is measured against.
        # They are downloaded, not built: the plugin targets the binary a user
        # actually installs, and the protocol surface differs between them.
        include:
          - officecli: "1.0.160"
            experimental: false
          - officecli: "1.0.158"
            experimental: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tags, for the release-asset step below
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The released officecli assets are framework-dependent single files: they
      # declare a dependency on Microsoft.NETCore.App 10.0.x (1.0.158 wants
      # 10.0.13, 1.0.160 wants 10.0.14). A runner that only has an older runtime
      # still starts the app — `--version` answers — and then dies on the first
      # document with "Could not load file or assembly
      # 'System.IO.Compression.ZipFile, Version=10.0.0.0'". Measured: one run
      # passed both arms and a run of the same commit failed 1.0.158 that way, so
      # the runtime is pinned here rather than inherited from the image.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Fetch officecli ${{ matrix.officecli }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 -o "$HOME/.local/bin/officecli" \
            "https://github.com/iOfficeAI/OfficeCLI/releases/download/v${{ matrix.officecli }}/officecli-linux-x64"
          chmod +x "$HOME/.local/bin/officecli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/officecli" --version

      - name: End-to-end suite
        run: OFFICECLI_BIN="$HOME/.local/bin/officecli" python3 tests/verify.py

      - name: Two-sided cell suite
        run: OFFICECLI_BIN="$HOME/.local/bin/officecli" python3 tests/cells.py

      - name: Schema lint over every fixture
        run: |
          set -euo pipefail
          for f in hyperlink mailto merged-cells vertical-text footnote endnote; do
            python3 tests/make_cell_fixture.py --feature "$f" --out "$RUNNER_TEMP/$f.odt"
            "$HOME/.local/bin/officecli" plugins lint ./plugin --fixture "$RUNNER_TEMP/$f.odt"
          done
          python3 tests/make_fixture.py "$RUNNER_TEMP/full.odt"
          "$HOME/.local/bin/officecli" plugins lint ./plugin --fixture "$RUNNER_TEMP/full.odt"

      # Documents this reader did not make: OpenOffice.org, OpenOffice, NeoOffice,
      # LibreOffice and pandoc output, pinned by commit and sha256 in
      # tests/corpus/sources.json. Every other fixture here is written by the same
      # hand as the reader, so a construct read from the wrong package part — or
      # skipped without a word — stays invisible in them.
      - name: Foreign corpus
        run: |
          set -euo pipefail
          python3 tests/corpus/fetch.py
          OFFICECLI_BIN="$HOME/.local/bin/officecli" python3 tests/corpus.py

      # The only axis here whose two ends are not the same hand: odfpy reads the
      # source, python-docx reads the produced document, and neither is this
      # repository's code, so a reader that loses a block cannot hide it by
      # losing it on both sides of the comparison. The reader itself needs no
      # third-party packages; this check does.
      #
      # Not gating yet: it has been measured on macOS arm64 only, and a step no
      # run has carried is a claim rather than a check. It runs and reports here,
      # and gates once one run of it has been read on this platform.
      - name: Foreign arbiter
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --quiet odfpy python-docx
          OFFICECLI_BIN="$HOME/.local/bin/officecli" python3 tests/foreign_axis.py

      # Path 2 of the README's install table, from the published release asset.
      # This is the line no local run could measure: the sandbox this plugin was
      # developed in cannot reach github.com with curl, so the download, the
      # discovery path and the conversion are exercised here instead.
      - name: Install from the release asset and convert through it
        if: matrix.officecli == '1.0.160'
        run: |
          set -euo pipefail
          TAG="$(git describe --tags --abbrev=0)"
          echo "release tag: $TAG"
          mkdir -p "$HOME/.officecli/plugins/dump-reader/odt"
          curl -fsSL --retry 3 -o "$HOME/.officecli/plugins/dump-reader/odt/plugin" \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/plugin"
          chmod +x "$HOME/.officecli/plugins/dump-reader/odt/plugin"
          # The asset is the tree, byte for byte — a release that drifted from
          # its source would otherwise be measured as if it had not.
          cmp plugin "$HOME/.officecli/plugins/dump-reader/odt/plugin"
          "$HOME/.local/bin/officecli" plugins list
          python3 tests/make_cell_fixture.py --feature footnote --out "$RUNNER_TEMP/installed.odt"
          cd "$RUNNER_TEMP"
          env -u OFFICECLI_PLUGIN_DUMP_READER_ODT "$HOME/.local/bin/officecli" get installed.odt /body
          "$HOME/.local/bin/officecli" validate installed.docx
          unzip -l installed.docx | grep -i footnotes.xml
